name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :automotive:testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: automotive/build/test-results/
          retention-days: 14

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # The manifest requires android.hardware.type.automotive, so the APK will not install
      # on a phone image — an automotive system image is mandatory, not a preference.
      SYSTEM_IMAGE: "system-images;android-35-ext15;android-automotive;x86_64"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      # Without KVM the x86_64 emulator falls back to software rendering and is too slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the automotive system image
        run: |
          yes | sdkmanager --install "$SYSTEM_IMAGE" emulator platform-tools > /dev/null

      - name: Create the AVD
        run: |
          echo no | avdmanager create avd \
            --force --name dashtune_ci \
            --package "$SYSTEM_IMAGE" \
            --device automotive_1024p_landscape

      - name: Boot the emulator
        run: |
          # nohup so the emulator outlives this step's shell.
          nohup $ANDROID_HOME/emulator/emulator -avd dashtune_ci \
            -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          # Poll for boot rather than sleeping a fixed amount; AAOS images boot slowly.
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82 || true

      - name: Run instrumented tests
        run: ./gradlew :automotive:connectedDebugAndroidTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            automotive/build/reports/androidTests/
            automotive/build/outputs/androidTest-results/
          retention-days: 14
